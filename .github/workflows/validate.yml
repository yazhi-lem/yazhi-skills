name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generated files are up to date
        run: python3 scripts/build_index.py --check

      - name: Committed .skill bundles are up to date
        run: python3 scripts/build_skill_bundle.py --per-skill --check

      - name: SKILL.md contract
        run: python3 scripts/validate_skills.py

      - name: Manifests are valid JSON
        run: |
          python3 -m json.tool .claude-plugin/plugin.json > /dev/null
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null
          python3 -m json.tool skills.json > /dev/null

      - name: Installer works
        run: |
          bash -n install.sh
          ./install.sh --dest "$RUNNER_TEMP/skills" --mode copy
          test -f "$RUNNER_TEMP/skills/age-appropriate-explaining/SKILL.md"
          test "$(find "$RUNNER_TEMP/skills" -name SKILL.md | wc -l)" -eq 51

      - name: Every bundle holds exactly one SKILL.md, at its root
        run: |
          python3 - <<'PY'
          import glob, posixpath, zipfile

          def skill_mds(path):
              names = zipfile.ZipFile(path).namelist()
              return [n for n in names if posixpath.basename(n) == "SKILL.md"]

          skill_bundles = sorted(glob.glob("dist/skills/*.skill"))
          bundles = ["dist/yazhi-skills.skill"] + skill_bundles
          assert len(bundles) == len(skill_bundles) + 1, (
              f"expected {len(skill_bundles) + 1} bundles, found {len(bundles)}"
          )
          for path in bundles:
              found = skill_mds(path)
              assert found == ["SKILL.md"], f"{path}: expected one root SKILL.md, got {found}"

          refs = [n for n in zipfile.ZipFile(bundles[0]).namelist()
                  if n.startswith("references/")]
          assert len(refs) == len(skill_bundles), (
              f"expected {len(skill_bundles)} reference files, got {len(refs)}"
          )
          print(f"bundle layout ok: {len(bundles)} bundles, one SKILL.md each")
          PY
